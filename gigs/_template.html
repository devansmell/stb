<!--
  1. add the gig to gigs/gigs-data.js
  2. copy this file to gigs/<slug>.html, slug matching the entry
  3. replace every {{PLACEHOLDER}}:
     {{TITLE}} page title, {{VENUE}}, {{CITY}}, {{DATE_DISPLAY}}, {{DOORS_TIME}},
     {{HEADLINE_ACT}} acts for seo, {{SLUG}}, {{POSTER_PATH}} e.g. /gigs/posters/x.jpg (spaces as %20),
     {{START}} / {{END}} e.g. 2026-12-17T23:59:00+00:00,
     {{TICKET_URL}}, {{PRICE}} (delete the whole "offers" block if there is no ticket info)
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} // split the bill</title>
<meta name="description" content="{{HEADLINE_ACT}} at {{VENUE}}, {{CITY}}. {{DATE_DISPLAY}}, doors {{DOORS_TIME}}. booked by split the bill, galway's independent gig promoters.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://splitthebill.ie/gigs/{{SLUG}}.html">

<meta property="og:type" content="website">
<meta property="og:site_name" content="split the bill">
<meta property="og:title" content="{{TITLE}} // split the bill">
<meta property="og:description" content="{{HEADLINE_ACT}} at {{VENUE}}, {{CITY}}. {{DATE_DISPLAY}}, doors {{DOORS_TIME}}.">
<meta property="og:url" content="https://splitthebill.ie/gigs/{{SLUG}}.html">
<meta property="og:image" content="https://splitthebill.ie{{POSTER_PATH}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="en_IE">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}} // split the bill">
<meta name="twitter:description" content="{{HEADLINE_ACT}} at {{VENUE}}, {{CITY}}. {{DATE_DISPLAY}}, doors {{DOORS_TIME}}.">
<meta name="twitter:image" content="https://splitthebill.ie{{POSTER_PATH}}">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "MusicEvent",
  "name": "{{TITLE}}",
  "description": "{{HEADLINE_ACT}} at {{VENUE}}, {{CITY}}.",
  "startDate": "{{START}}",
  "endDate": "{{END}}",
  "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
  "eventStatus": "https://schema.org/EventScheduled",
  "location": {
    "@type": "Place",
    "name": "{{VENUE}}",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "{{CITY}}",
      "addressCountry": "IE"
    }
  },
  "image": ["https://splitthebill.ie{{POSTER_PATH}}"],
  "performer": [
    { "@type": "PerformingGroup", "name": "{{HEADLINE_ACT}}" }
  ],
  "organizer": {
    "@type": "Organization",
    "name": "Split The Bill",
    "url": "https://splitthebill.ie/"
  },
  "offers": {
    "@type": "Offer",
    "url": "{{TICKET_URL}}",
    "price": "{{PRICE}}",
    "priceCurrency": "EUR",
    "availability": "https://schema.org/InStock"
  }
}
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

  <div class="page">
    <img class="bg" src="/assets/background-still.webp" data-motion-src="/assets/background.webp" alt="" aria-hidden="true">
    <div class="bg-overlay" aria-hidden="true"></div>

    <div class="page-content">
      <header class="page-header">
        <img class="corner-logo" src="/assets/logo.png" alt="split the bill logo">
        <div class="page-heading">
          <h1 class="page-title">gigs</h1>
          <a href="/gigs/" class="back-link">&lt;-- back</a>
        </div>
      </header>

      <div class="gig-card-wrap">
        <div class="gig-card">

          <div class="gig-poster-wrap">
            <img class="gig-poster" id="gig-poster" src="" alt="">
          </div>

          <div class="gig-info">
            <h2 class="gig-venue" id="gig-venue"></h2>
            <p class="gig-datetime" id="gig-datetime"></p>

            <ul class="lineup-list" id="lineup-list" aria-label="Lineup"></ul>

            <p class="gig-cta" id="gig-cta"></p>
          </div>

        </div>
      </div>

      <div class="gig-gallery-wrap" id="gig-gallery-wrap">
        <div class="gig-gallery">
          <p class="gig-gallery-blurb" id="gig-gallery-blurb"></p>
          <div class="gallery-grid" id="gallery-grid" role="list" aria-label="Photos from the night"></div>
        </div>
      </div>
    </div>
  </div>

  <script>const PAGE_SLUG = "{{SLUG}}";</script>
  <script src="/gigs/gigs-data.js"></script>
  <script src="/gigs/gig-detail.js"></script>
  <script src="/gigs/gallery.js"></script>
  <script src="/motion.js" defer></script>
</body>
</html>
